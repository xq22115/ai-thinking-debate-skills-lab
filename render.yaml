services:
  - type: web
    name: gpt-deep-reasoning-gateway
    runtime: python
    plan: free
    rootDir: examples/render-deep-reasoning-gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GATEWAY_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: POLL_INTERVAL_SECONDS
        value: "1.5"
      - key: POLL_TIMEOUT_SECONDS
        value: "900"
      - key: MAX_PROMPT_CHARS
        value: "50000"
      - key: MAX_CONCURRENCY
        value: "2"
