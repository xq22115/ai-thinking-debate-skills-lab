name: Elite Legal Correspondence Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  pull_request:
    paths:
      - ".github/workflows/elite-legal-correspondence-radar.yml"
      - "skills/skills/elite-legal-correspondence/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/elite-legal-correspondence-radar.yml"
      - "skills/skills/elite-legal-correspondence/**"

permissions:
  contents: read

concurrency:
  group: elite-legal-correspondence-radar-${{ github.ref }}
  cancel-in-progress: false

env:
  SKILL_ROOT: skills/skills/elite-legal-correspondence

jobs:
  static-validation:
    name: Static contract and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7.0.1

      - name: Validate ten-lane evidence contract
        run: python3 "$SKILL_ROOT/scripts/monitor_sources.py" validate

      - name: Run offline unit tests
        run: python3 -m unittest discover -s "$SKILL_ROOT/tests" -p "test_*.py" -v

  research:
    name: Research ${{ matrix.lane }}
    if: github.event_name != 'pull_request'
    needs:
      - static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        lane:
          - lane-01-harvey
          - lane-02-lexis
          - lane-03-cocounsel
          - lane-04-gemini-legal
          - lane-05-clio-vincent
          - lane-06-legaltype
          - lane-07-litera
          - lane-08-wordsmith
          - lane-09-spellbook
          - lane-10-legalon
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7.0.1

      - name: Scan independent official-source lane
        id: scan
        continue-on-error: true
        env:
          LANE: ${{ matrix.lane }}
        run: |
          mkdir -p artifacts/workers
          python3 "$SKILL_ROOT/scripts/monitor_sources.py" scan \
            --lane "$LANE" \
            --out "artifacts/workers/$LANE.json"

      - name: Upload worker evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-${{ matrix.lane }}
          path: artifacts/workers/${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed if live scan failed
        if: steps.scan.outcome != 'success'
        run: |
          echo "Live evidence scan failed for ${{ matrix.lane }}; receipt was preserved."
          exit 1

  adjudicate:
    name: Adjudicate ten independent receipts
    if: ${{ always() && github.event_name != 'pull_request' && needs.static-validation.result == 'success' }}
    needs:
      - static-validation
      - research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7.0.1

      - name: Download all worker evidence
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: worker-*
          path: artifacts/workers
          merge-multiple: true

      - name: Merge and fail closed on missing or invalid evidence
        run: |
          mkdir -p artifacts/adjudicated
          python3 "$SKILL_ROOT/scripts/monitor_sources.py" merge \
            --inputs-dir artifacts/workers \
            --out artifacts/adjudicated/latest.json

      - name: Upload adjudicated research ledger
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: elite-legal-correspondence-radar-${{ github.run_id }}
          path: artifacts/adjudicated/latest.json
          if-no-files-found: warn
          retention-days: 90
