name: Render deep reasoning gateway

on:
  push:
    paths:
      - "examples/render-deep-reasoning-gateway/**"
      - "render.yaml"
      - ".github/workflows/render-deep-reasoning-gateway.yml"
  pull_request:
    paths:
      - "examples/render-deep-reasoning-gateway/**"
      - "render.yaml"
      - ".github/workflows/render-deep-reasoning-gateway.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/render-deep-reasoning-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: examples/render-deep-reasoning-gateway/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q main.py benchmark.py tests

      - name: Run tests
        run: python -m pytest -q
