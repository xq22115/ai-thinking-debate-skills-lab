name: Reasoning Eval Harness Gate

on:
  push:
    paths:
      - 'skills/evals/**'
      - '.github/workflows/reasoning-eval-harness-gate.yml'
  pull_request:
    paths:
      - 'skills/evals/**'
      - '.github/workflows/reasoning-eval-harness-gate.yml'

permissions:
  contents: read

jobs:
  reasoning-eval-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile evaluation tools
        run: |
          python -m py_compile skills/evals/run_reasoning_evals.py
          python -m py_compile skills/evals/reasoning_eval_engine.py
          python -m py_compile skills/evals/verify_target_execution_receipt.py
          python -m py_compile skills/evals/prepare_holdout_commitment.py
          python -m py_compile skills/evals/freeze_eval_responses.py
          python -m py_compile skills/evals/verify_holdout_reveal.py

      - name: Validate machine-readable contracts
        run: |
          python -m json.tool skills/evals/reasoning-eval-result.schema.json >/dev/null
          python -m json.tool skills/evals/reasoning-eval-manifest.schema.json >/dev/null
          python -m json.tool skills/evals/target-execution-receipt.schema.json >/dev/null
          python -m json.tool skills/evals/holdout-blueprint.schema.json >/dev/null
          python -m json.tool skills/evals/holdout-commitment.schema.json >/dev/null
          python -m json.tool skills/evals/response-freeze-receipt.schema.json >/dev/null
          python -m json.tool skills/evals/holdout-reveal-receipt.schema.json >/dev/null
          python -m json.tool skills/evals/paired-judge-execution-plan.json >/dev/null
          python -m json.tool skills/evals/examples/public-example-manifest.json >/dev/null
          python -m json.tool skills/evals/examples/public-example-oracle.json >/dev/null
          python -m json.tool skills/evals/examples/public-example-holdout-blueprint.json >/dev/null

      - name: Public NON-HIDDEN example remains SAME_MODEL_SMOKE
        run: |
          python skills/evals/run_reasoning_evals.py \
            --manifest skills/evals/examples/public-example-manifest.json \
            --responses skills/evals/examples/public-example-responses.jsonl \
            --oracle skills/evals/examples/public-example-oracle.json \
            --out /tmp/public-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/public-result.json').read_text())
          assert r['status']=='PASS', r
          assert r['evidence_class']=='SAME_MODEL_SMOKE', r
          assert r['summary']['passed']==3 and r['summary']['failed']==0, r
          assert r['execution']['execution_receipt_verified'] is False, r
          PY

      - name: Build synthetic owning-runtime receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def h(v):
              raw=json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
              return hashlib.sha256(raw).hexdigest()
          m=json.loads(Path('skills/evals/examples/public-example-manifest.json').read_text())
          m['run_id']='synthetic-fresh-attested-001'
          m['contamination']['authoring_overlap']=False
          m['contamination']['fixture_visible_to_generator']=False
          m['contamination']['expected_labels_visible_to_generator']=False
          m['execution']['fresh_context']=True
          m['execution']['runtime_independent']=True
          m['execution']['target_id']='synthetic-target'
          rows=[]
          for raw in Path('skills/evals/examples/public-example-responses.jsonl').read_text().splitlines():
              if raw.strip():
                  row=json.loads(raw); row['run_id']=m['run_id']; rows.append(row)
          Path('/tmp/fresh-manifest.json').write_text(json.dumps(m))
          Path('/tmp/fresh-responses.jsonl').write_text('\n'.join(json.dumps(x) for x in rows)+'\n')
          normalized=sorted(rows,key=lambda x:x.get('case_id',''))
          receipt={
            'schema_version':'1.0','status':'PASS_TARGET_EXECUTION',
            'suite':m['suite'],'run_id':m['run_id'],'target_id':'synthetic-target',
            'execution_id':'ci-synthetic-execution-001','created_at':'2026-09-10T00:00:00Z',
            'provenance':{
              'source_class':'EXTERNAL_JOB','source_name':'github-actions-synthetic-regression',
              'receipt_locator':'github-actions://synthetic-regression-only',
              'target_executed_verified':True,'fresh_context_verified':True,
              'runtime_independent_verified':True,'expected_labels_hidden_verified':True,
              'notes':'Synthetic CI attestation; tests promotion logic only.'},
            'binding':{
              'manifest_canonical_sha256':h(m),'responses_canonical_sha256':h(normalized),
              'response_count':len(rows),'request_set_canonical_sha256':None},
            'boundary':{'oracle_quality_verified':False,'judge_independence_verified':False,'holdout_privacy_verified':False}
          }
          Path('/tmp/fresh-execution-receipt.json').write_text(json.dumps(receipt))
          PY

      - name: Manifest-only fresh-context claim fails closed
        run: |
          python skills/evals/run_reasoning_evals.py \
            --manifest /tmp/fresh-manifest.json \
            --responses /tmp/fresh-responses.jsonl \
            --out /tmp/no-attestation.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/no-attestation.json').read_text())
          assert r['evidence_class']=='SAME_MODEL_SMOKE', r
          assert r['execution']['execution_receipt_verified'] is False, r
          assert 'hash-bound owning-runtime/external-job execution receipt' in r['promotion']['blocking_reasons'][0], r
          PY

      - name: Correct execution receipt unlocks only FRESH_CONTEXT_RUN
        run: |
          python skills/evals/verify_target_execution_receipt.py \
            --manifest /tmp/fresh-manifest.json \
            --responses /tmp/fresh-responses.jsonl \
            --receipt /tmp/fresh-execution-receipt.json \
            --out /tmp/fresh-receipt-check.json
          python skills/evals/run_reasoning_evals.py \
            --manifest /tmp/fresh-manifest.json \
            --responses /tmp/fresh-responses.jsonl \
            --execution-receipt /tmp/fresh-execution-receipt.json \
            --out /tmp/fresh-attested-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          check=json.loads(Path('/tmp/fresh-receipt-check.json').read_text())
          r=json.loads(Path('/tmp/fresh-attested-result.json').read_text())
          assert check['verified'] is True, check
          assert check['fresh_context_claim_verified'] is True, check
          assert r['evidence_class']=='FRESH_CONTEXT_RUN', r
          assert r['execution']['execution_receipt_verified'] is True, r
          assert r['execution']['fresh_context_claim_verified'] is True, r
          assert r['holdout']['commitment_reveal_verified'] is False, r
          PY

      - name: Execution receipt is response-bound and target-bound
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/fresh-responses.jsonl').read_text().splitlines() if x.strip()]
          rows[0]['output']['labels']=['tampered']
          Path('/tmp/tampered-responses.jsonl').write_text('\n'.join(json.dumps(x) for x in rows)+'\n')
          m=json.loads(Path('/tmp/fresh-manifest.json').read_text()); m['execution']['target_id']='other-target'
          Path('/tmp/wrong-target-manifest.json').write_text(json.dumps(m))
          PY
          set +e
          python skills/evals/run_reasoning_evals.py --manifest /tmp/fresh-manifest.json --responses /tmp/tampered-responses.jsonl --execution-receipt /tmp/fresh-execution-receipt.json --out /tmp/tampered-exec.json
          rc1=$?
          python skills/evals/run_reasoning_evals.py --manifest /tmp/wrong-target-manifest.json --responses /tmp/fresh-responses.jsonl --execution-receipt /tmp/fresh-execution-receipt.json --out /tmp/wrong-target.json
          rc2=$?
          set -e
          test "$rc1" -eq 2
          test "$rc2" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/tampered-exec.json').read_text())
          b=json.loads(Path('/tmp/wrong-target.json').read_text())
          assert 'response-set hash mismatch' in a['error'], a
          assert ('target_id mismatch' in b['error']) or ('manifest hash mismatch' in b['error']), b
          PY

      - name: Salted commit-reveal still detects oracle tampering
        run: |
          python skills/evals/prepare_holdout_commitment.py \
            --blueprint skills/evals/examples/public-example-holdout-blueprint.json \
            --manifest-out /tmp/generated-manifest.json \
            --oracle-out /tmp/generated-oracle.json \
            --salt-out /tmp/generated-salt.txt \
            --commitment-out /tmp/generated-commitment.json \
            --salt-hex 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          python skills/evals/freeze_eval_responses.py --manifest /tmp/generated-manifest.json --responses skills/evals/examples/public-example-responses.jsonl --out /tmp/generated-freeze.json
          python skills/evals/verify_holdout_reveal.py --commitment /tmp/generated-commitment.json --manifest /tmp/generated-manifest.json --freeze-receipt /tmp/generated-freeze.json --oracle /tmp/generated-oracle.json --salt /tmp/generated-salt.txt --out /tmp/generated-reveal.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/generated-reveal.json').read_text())
          assert r['status']=='PASS_COMMITMENT_REVEAL' and r['verified'] is True, r
          o=json.loads(Path('/tmp/generated-oracle.json').read_text())
          for c in o['cases']:
              if c['case_id']=='public-exact-001': c['scoring']['expected']='COMMIT'
          Path('/tmp/tampered-oracle.json').write_text(json.dumps(o))
          PY
          set +e
          python skills/evals/verify_holdout_reveal.py --commitment /tmp/generated-commitment.json --manifest /tmp/generated-manifest.json --freeze-receipt /tmp/generated-freeze.json --oracle /tmp/tampered-oracle.json --salt /tmp/generated-salt.txt --out /tmp/tampered-reveal.json
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Contract invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          engine=Path('skills/evals/reasoning_eval_engine.py').read_text()
          verifier=Path('skills/evals/verify_target_execution_receipt.py').read_text()
          assert 'execution_receipt_verified' in engine
          assert 'fresh_context_claim_verified' in engine
          assert 'MANIFEST' not in ''  # keep shell block non-empty after assertions
          assert 'OWNING_RUNTIME' in verifier and 'EXTERNAL_JOB' in verifier
          assert 'semantic_truth_of_runtime_claims_verified' in verifier
          PY
