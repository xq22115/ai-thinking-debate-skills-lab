name: Task Goal Intelligence v3.1 Gate

on:
  push:
    paths:
      - 'skills/skills/task-goal-intelligence/SKILL.md'
      - 'plugins/ai-efficiency-operating-system/skills/task-goal-intelligence/SKILL.md'
      - 'control-plane/ai-system/configs/goal-fidelity-global.json'
      - 'control-plane/ai-system/configs/task-goal-intelligence-v3-extension.json'
      - 'control-plane/ai-system/configs/task-goal-intelligence-v3-sources.json'
      - 'control-plane/ai-system/configs/task-goal-intelligence-v31-truth-maintenance.json'
      - 'control-plane/ai-system/configs/global-policy-manifest.json'
      - 'control-plane/scripts/task_goal_state_engine.py'
      - 'control-plane/scripts/validate_task_goal_intelligence_v31.py'
      - 'control-plane/tests/test_task_goal_state_engine.py'
      - 'control-plane/tests/test_task_goal_state_engine_authority.py'
      - '.agents/hooks/goal-fidelity-preinvocation.py'
      - 'docs/GLOBAL_POLICY_KERNEL.md'
      - '.github/workflows/task-goal-intelligence-v31-gate.yml'
  pull_request:
    paths:
      - 'skills/skills/task-goal-intelligence/SKILL.md'
      - 'plugins/ai-efficiency-operating-system/skills/task-goal-intelligence/SKILL.md'
      - 'control-plane/ai-system/configs/goal-fidelity-global.json'
      - 'control-plane/ai-system/configs/task-goal-intelligence-v3-extension.json'
      - 'control-plane/ai-system/configs/task-goal-intelligence-v3-sources.json'
      - 'control-plane/ai-system/configs/task-goal-intelligence-v31-truth-maintenance.json'
      - 'control-plane/ai-system/configs/global-policy-manifest.json'
      - 'control-plane/scripts/task_goal_state_engine.py'
      - 'control-plane/scripts/validate_task_goal_intelligence_v31.py'
      - 'control-plane/tests/test_task_goal_state_engine.py'
      - 'control-plane/tests/test_task_goal_state_engine_authority.py'
      - '.agents/hooks/goal-fidelity-preinvocation.py'
      - 'docs/GLOBAL_POLICY_KERNEL.md'
      - '.github/workflows/task-goal-intelligence-v31-gate.yml'

permissions:
  contents: read

jobs:
  task-goal-intelligence-v31:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse and compile full goal stack
        run: |
          python -m json.tool control-plane/ai-system/configs/goal-fidelity-global.json >/dev/null
          python -m json.tool control-plane/ai-system/configs/task-goal-intelligence-v3-extension.json >/dev/null
          python -m json.tool control-plane/ai-system/configs/task-goal-intelligence-v3-sources.json >/dev/null
          python -m json.tool control-plane/ai-system/configs/task-goal-intelligence-v31-truth-maintenance.json >/dev/null
          python -m json.tool control-plane/ai-system/configs/global-policy-manifest.json >/dev/null
          python -m py_compile \
            .agents/hooks/goal-fidelity-preinvocation.py \
            control-plane/scripts/task_goal_state_engine.py \
            control-plane/scripts/validate_goal_fidelity_global.py \
            control-plane/scripts/validate_goal_intelligence_extension.py \
            control-plane/scripts/validate_task_goal_intelligence_v22.py \
            control-plane/scripts/validate_task_goal_intelligence_v3.py \
            control-plane/scripts/validate_task_goal_intelligence_v31.py \
            control-plane/scripts/validate_global_policy_durability.py
      - name: Validate v2.2, v3 and v3.1 contracts
        run: |
          python control-plane/scripts/validate_goal_fidelity_global.py
          python control-plane/scripts/validate_goal_intelligence_extension.py
          python control-plane/scripts/validate_task_goal_intelligence_v22.py
          python control-plane/scripts/validate_task_goal_intelligence_v3.py
          python control-plane/scripts/validate_task_goal_intelligence_v31.py
          python control-plane/scripts/validate_global_policy_durability.py
      - name: Run executable v3.1 goal-state behavior corpus
        working-directory: control-plane
        run: |
          python -m unittest -v \
            tests.test_task_goal_state_engine \
            tests.test_task_goal_state_engine_authority
      - name: Protect legacy Goal Lock behavior
        working-directory: control-plane
        run: |
          python -m unittest -v \
            tests.test_goal_fidelity_preinvocation \
            tests.test_antigravity_goal_lock_projection
