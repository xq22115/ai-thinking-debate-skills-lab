name: Legacy v4 Infrastructure Self-Test (Artifact Only)

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Historical v4 request under archive/ordinary-chat-v4-evidence/requests/
        required: true
        default: archive/ordinary-chat-v4-evidence/requests/20260827T0742-prove-ready-v4-final.json
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-v4-selftest-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify-lanes:
    name: ${{ matrix.lane }}-${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: A01, role: goal-proof}
          - {lane: A02, role: route-proof}
          - {lane: A03, role: execution-proof}
          - {lane: A04, role: recovery-proof}
          - {lane: A05, role: artifact-proof}
          - {lane: A06, role: protocol-latest}
          - {lane: A07, role: supply-chain}
          - {lane: A08, role: runtime-independence}
          - {lane: A09, role: observability}
          - {lane: A10, role: red-team}
    steps:
      - name: Checkout exact source revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate archived request path
        env:
          REQUEST_FILE: ${{ inputs.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUEST_FILE" in
            archive/ordinary-chat-v4-evidence/requests/*.json) ;;
            *) echo "legacy self-test only accepts archived v4 requests: $REQUEST_FILE" >&2; exit 2 ;;
          esac
          test -f "$REQUEST_FILE"
          echo "REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
      - name: Run fixed historical verification lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python control-plane/scripts/ordinary_chat_completion_gate.py lane \
            --lane '${{ matrix.lane }}' \
            --request "$REQUEST_FILE" \
            --output 'proof/${{ matrix.lane }}.json'
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-v4-lane-${{ matrix.lane }}
          path: proof/${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate-proof:
    name: aggregate-legacy-v4-diagnostic
    if: always()
    needs: verify-lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download all lane evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: legacy-v4-lane-*
          path: lane-evidence
          merge-multiple: true
      - name: Validate archived request path
        env:
          REQUEST_FILE: ${{ inputs.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUEST_FILE" in
            archive/ordinary-chat-v4-evidence/requests/*.json) ;;
            *) echo "invalid archived v4 request: $REQUEST_FILE" >&2; exit 2 ;;
          esac
          test -f "$REQUEST_FILE"
          echo "REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
      - name: Aggregate historical diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          python control-plane/scripts/ordinary_chat_completion_gate.py aggregate \
            --request "$REQUEST_FILE" \
            --reports-dir lane-evidence \
            --output-dir final-proof
      - name: Mark bundle as legacy diagnostic, not task completion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('final-proof/completion-report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          report['evidence_scope'] = 'historical_v4_infrastructure_self_test_only'
          report['task_executor'] = False
          report['must_not_substitute_for_v5_task_completion'] = True
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload legacy diagnostic bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-v4-diagnostic-${{ github.run_id }}
          path: final-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce historical diagnostic consistency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('final-proof/completion-report.json').read_text(encoding='utf-8'))
          if report.get('task_executor') is not False:
              raise SystemExit('legacy diagnostic must never identify itself as a task executor')
          if report.get('evidence_scope') != 'historical_v4_infrastructure_self_test_only':
              raise SystemExit('legacy evidence scope missing')
          PY
