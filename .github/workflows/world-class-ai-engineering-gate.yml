name: World-Class AI Engineering Gate

on:
  pull_request:
    paths:
      - 'skills/skills/world-class-ai-engineering/**'
      - 'skills/evals/world-class-ai-engineering-pressure-cases.jsonl'
      - 'control-plane/scripts/validate_world_class_ai_engineering_skill.py'
      - '.github/workflows/world-class-ai-engineering-gate.yml'
  push:
    paths:
      - 'skills/skills/world-class-ai-engineering/**'
      - 'skills/evals/world-class-ai-engineering-pressure-cases.jsonl'
      - 'control-plane/scripts/validate_world_class_ai_engineering_skill.py'
      - '.github/workflows/world-class-ai-engineering-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate world-class AI engineering skill pack
        run: python control-plane/scripts/validate_world_class_ai_engineering_skill.py
