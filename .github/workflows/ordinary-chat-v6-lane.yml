name: Ordinary Chat v6 Independent Lane

on:
  push:
    branches:
      - 'v6-a**'
      - 'ordinary-chat-agent-stack-v6-closure'
  pull_request:
    paths:
      - 'control-plane/**'
      - 'research/ordinary-chat-v6/**'
      - '.github/workflows/ordinary-chat-v6-lane.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compile v6 validators
        run: |
          python -m py_compile \
            control-plane/scripts/ordinary_chat_v6_lane.py \
            control-plane/scripts/ordinary_chat_coordination.py \
            control-plane/scripts/chat_ux_report.py \
            control-plane/scripts/ordinary_chat_release_gate.py
          node --check control-plane/browser/chatgpt-flight-recorder/content.js
          node --check control-plane/browser/chatgpt-flight-recorder/popup.js
      - name: Run branch-specific veto lane
        if: startsWith(github.ref_name, 'v6-a')
        run: |
          python control-plane/scripts/ordinary_chat_v6_lane.py \
            --branch '${{ github.ref_name }}' \
            --output '${{ runner.temp }}/v6-lane.json'
      - name: Run ten-lane integration aggregate
        if: github.ref_name == 'ordinary-chat-agent-stack-v6-closure'
        run: |
          python control-plane/scripts/ordinary_chat_v6_lane.py \
            --all \
            --output '${{ runner.temp }}/v6-lane.json'
      - name: Upload lane evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ordinary-chat-v6-${{ github.ref_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v6-lane.json
          if-no-files-found: error
          retention-days: 30
