name: Ordinary Chat Task Execute

on:
  push:
    branches:
      - 'chat-task/**'
      - ordinary-chat-agent-stack-v5-task-runtime
    paths:
      - 'control-plane/ordinary-chat-task-requests/*.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: Exact task request path under control-plane/ordinary-chat-task-requests/
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ordinary-chat-task-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  execute-and-adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact task revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve exactly one declarative request
        env:
          DISPATCH_REQUEST: ${{ inputs.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          request=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            mapfile -t requests < <(git diff --name-only HEAD^ HEAD -- 'control-plane/ordinary-chat-task-requests/*.json')
            if [ "${#requests[@]}" -ne 1 ]; then
              echo "expected exactly one changed task request, got ${#requests[@]}" >&2
              exit 2
            fi
            request="${requests[0]}"
          else
            request="${DISPATCH_REQUEST}"
          fi
          case "$request" in
            control-plane/ordinary-chat-task-requests/*.json) ;;
            *) echo "invalid request path: $request" >&2; exit 2 ;;
          esac
          test -f "$request"
          echo "REQUEST_FILE=$request" >> "$GITHUB_ENV"
          commit_task="$(python - "$request" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8')).get('mutation', {}).get('commit', False)
          print('true' if value is True else 'false')
          PY
          )"
          echo "COMMIT_TASK=$commit_task" >> "$GITHUB_ENV"
          if [ "$commit_task" = "true" ] && [[ "${GITHUB_REF}" != refs/heads/chat-task/* ]]; then
            echo "mutation.commit=true requires a dedicated chat-task/* branch" >&2
            exit 2
          fi
      - name: Execute dependency-aware task plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ordinary-chat-task/state" "$RUNNER_TEMP/ordinary-chat-task/output"
          python control-plane/scripts/ordinary_chat_task_runtime.py execute \
            --request "$REQUEST_FILE" \
            --config control-plane/ai-system/configs/ordinary-chat-task-runtime.json \
            --state "$RUNNER_TEMP/ordinary-chat-task/state/state.json" \
            --output "$RUNNER_TEMP/ordinary-chat-task/output/primary.json"
      - name: Prove durable resume is idempotent
        shell: bash
        run: |
          set -euo pipefail
          python control-plane/scripts/ordinary_chat_task_runtime.py execute \
            --request "$REQUEST_FILE" \
            --config control-plane/ai-system/configs/ordinary-chat-task-runtime.json \
            --state "$RUNNER_TEMP/ordinary-chat-task/state/state.json" \
            --output "$RUNNER_TEMP/ordinary-chat-task/output/resume.json" \
            --resume-probe
      - name: Adjudicate five task-outcome proofs
        shell: bash
        run: |
          set -euo pipefail
          python control-plane/scripts/ordinary_chat_task_runtime.py adjudicate \
            --request "$REQUEST_FILE" \
            --primary "$RUNNER_TEMP/ordinary-chat-task/output/primary.json" \
            --resume "$RUNNER_TEMP/ordinary-chat-task/output/resume.json" \
            --output "$RUNNER_TEMP/ordinary-chat-task/output/completion-report.json"
      - name: Build auditable task result bundle
        shell: bash
        run: |
          set -euo pipefail
          request_id="$(python - <<'PY'
          import json, os
          print(json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))['request_id'])
          PY
          )"
          result_dir="control-plane/ordinary-chat-task-results/$request_id"
          mkdir -p "$result_dir"
          cp "$REQUEST_FILE" "$result_dir/request.json"
          cp "$RUNNER_TEMP/ordinary-chat-task/output/primary.json" "$result_dir/primary.json"
          cp "$RUNNER_TEMP/ordinary-chat-task/output/resume.json" "$result_dir/resume.json"
          cp "$RUNNER_TEMP/ordinary-chat-task/output/completion-report.json" "$result_dir/completion-report.json"
          cp "$RUNNER_TEMP/ordinary-chat-task/state/state.json" "$result_dir/state.json"
          if [ -d "$RUNNER_TEMP/ordinary-chat-task/output/fetch" ]; then
            cp -R "$RUNNER_TEMP/ordinary-chat-task/output/fetch" "$result_dir/fetch"
          fi
          RESULT_DIR="$result_dir" python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RESULT_DIR'])
          pointer = {
              'schemaVersion': 1,
              'github_repository': os.environ['GITHUB_REPOSITORY'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'source_request_sha': os.environ['GITHUB_SHA'],
              'task_branch': os.environ['GITHUB_REF_NAME'],
          }
          (root / 'run-pointer.json').write_text(json.dumps(pointer, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          RESULT_DIR="$result_dir" python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RESULT_DIR'])
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS.json':
                  manifest[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256SUMS.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          echo "RESULT_DIR=$result_dir" >> "$GITHUB_ENV"
      - name: Upload complete task receipt bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ordinary-chat-task-${{ github.run_id }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 30
      - name: Verify and commit task mutations on dedicated task branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/chat-task/') && env.COMMIT_TASK == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          primary = json.load(open(os.environ['RUNNER_TEMP'] + '/ordinary-chat-task/output/primary.json', encoding='utf-8'))
          expected = set(primary['changed_paths'])
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          result_prefix = os.environ['RESULT_DIR'].rstrip('/') + '/'
          actual = {p for p in tracked | untracked if not p.startswith(result_prefix)}
          if actual != expected:
              raise SystemExit(f'working tree mismatch: expected={sorted(expected)} actual={sorted(actual)}')
          for path in expected:
              if path.startswith('control-plane/ordinary-chat-task-results/') or path.startswith('control-plane/ordinary-chat-task-requests/'):
                  raise SystemExit(f'request attempted to mutate control data: {path}')
          PY
          git config user.name 'ordinary-chat-task-bot'
          git config user.email 'ordinary-chat-task-bot@users.noreply.github.com'
          git add -A
          git commit -m "task: complete $(basename "$REQUEST_FILE" .json)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
