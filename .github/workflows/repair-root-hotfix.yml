name: Repair Root Hotfix

on:
  push:
    branches:
      - fix/plan-scoped-write-response-flow

permissions:
  contents: write

jobs:
  patch-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct validator working root
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/plan-scoped-write-repair.yml')
          text = p.read_text(encoding='utf-8')
          old = 'python control-plane/scripts/validate_agent_control_plane.py --root control-plane'
          new = '(cd control-plane && python scripts/validate_agent_control_plane.py --root .)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one validator command, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/repair-root-hotfix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix repair workflow validator root'
          git push origin HEAD:${GITHUB_REF_NAME}
