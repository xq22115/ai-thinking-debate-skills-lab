name: Ordinary Chat Agent Stack

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'README.md'
      - 'control-plane/README.md'
      - 'control-plane/index.html'
      - 'control-plane/package.json'
      - 'control-plane/scripts/ordinary_chat_bridge.py'
      - 'control-plane/scripts/ordinary_chat_completion_gate.py'
      - 'control-plane/scripts/ordinary_chat_task_runtime.py'
      - 'control-plane/scripts/ordinary_chat_v5_review.py'
      - 'control-plane/scripts/project_memory.py'
      - 'control-plane/scripts/capability_health.py'
      - 'control-plane/scripts/capability_router.py'
      - 'control-plane/scripts/run_reconciler.py'
      - 'control-plane/scripts/bootstrap_ordinary_chat_stack.sh'
      - 'control-plane/scripts/bootstrap_browser_use.sh'
      - 'control-plane/tests/test_ordinary_chat_bridge.py'
      - 'control-plane/tests/test_ordinary_chat_completion_gate.py'
      - 'control-plane/tests/test_ordinary_chat_task_runtime.py'
      - 'control-plane/tests/test_ordinary_chat_chaos.py'
      - 'control-plane/tests/test_project_memory.py'
      - 'control-plane/tests/test_capability_router.py'
      - 'control-plane/tests/test_run_reconciler.py'
      - 'control-plane/tests/test_ordinary_chat_dashboard.py'
      - 'control-plane/ordinary-chat-dashboard/**'
      - 'control-plane/ordinary-chat-task-requests/**'
      - 'control-plane/ai-system/mcp/**'
      - 'control-plane/ai-system/browser/**'
      - 'control-plane/ai-system/configs/ordinary-chat-*.json'
      - 'skills/ordinary-chat-agent-router/**'
      - 'debates/2026-08-26/**'
      - 'research/ordinary-chat-upstreams/**'
      - 'archive/ordinary-chat-v4-evidence/**'
      - '.github/workflows/ordinary-chat-agent-stack.yml'
      - '.github/workflows/ordinary-chat-immediate-use.yml'
      - '.github/workflows/ordinary-chat-task-execute.yml'
      - '.github/workflows/ordinary-chat-task-runtime-ci.yml'
      - '.github/workflows/ordinary-chat-v5-review.yml'
  push:
    branches:
      - ordinary-chat-agent-stack-v2
      - ordinary-chat-agent-stack-v3-adaptive-runtime
      - ordinary-chat-agent-stack-v3.1-adversarial-verification
      - ordinary-chat-agent-stack-v3.2-chaos-recovery
      - ordinary-chat-agent-stack-v4-immediate-use
      - ordinary-chat-agent-stack-v5-task-runtime

permissions:
  contents: read

jobs:
  python-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile ordinary-chat Python
        run: |
          python -m py_compile control-plane/scripts/ordinary_chat_bridge.py
          python -m py_compile control-plane/scripts/ordinary_chat_completion_gate.py
          python -m py_compile control-plane/scripts/ordinary_chat_task_runtime.py
          python -m py_compile control-plane/scripts/ordinary_chat_v5_review.py
          python -m py_compile control-plane/scripts/project_memory.py
          python -m py_compile control-plane/scripts/capability_health.py
          python -m py_compile control-plane/scripts/capability_router.py
          python -m py_compile control-plane/scripts/run_reconciler.py
          python -m py_compile control-plane/ordinary-chat-dashboard/server.py
      - name: Run bridge tests
        run: python control-plane/tests/test_ordinary_chat_bridge.py
      - name: Run completion-gate contract tests
        run: python control-plane/tests/test_ordinary_chat_completion_gate.py
      - name: Run real task runtime regression tests
        run: python -m unittest control-plane/tests/test_ordinary_chat_task_runtime.py -v
      - name: Run memory tests
        run: python control-plane/tests/test_project_memory.py
      - name: Run adaptive routing tests
        run: python control-plane/tests/test_capability_router.py
      - name: Run liveness reconciliation tests
        run: python control-plane/tests/test_run_reconciler.py
      - name: Run chaos/recovery tests
        run: python control-plane/tests/test_ordinary_chat_chaos.py
      - name: Run dashboard tests
        run: python control-plane/tests/test_ordinary_chat_dashboard.py
      - name: Validate JSON policies
        run: |
          python - <<'PY'
          import json, pathlib
          paths = [
              pathlib.Path('control-plane/ai-system/configs/ordinary-chat-capabilities.json'),
              pathlib.Path('control-plane/ai-system/configs/ordinary-chat-routing.json'),
              pathlib.Path('control-plane/ai-system/configs/ordinary-chat-security.json'),
              pathlib.Path('control-plane/ai-system/configs/ordinary-chat-immediate-use.json'),
              pathlib.Path('control-plane/ai-system/configs/ordinary-chat-task-runtime.json'),
              pathlib.Path('control-plane/ai-system/browser/playwright.mcp.example.json'),
              pathlib.Path('archive/ordinary-chat-v4-evidence/deterministic-lanes.json'),
              pathlib.Path('research/ordinary-chat-upstreams/2026-08-27-v5-lockfile-e2e.json'),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print('PASS', path)
          PY
      - name: Reject active generated-v4 evidence and demo-template residue
        run: |
          set -euo pipefail
          test ! -e control-plane/ordinary-chat-proofs
          test ! -e control-plane/ordinary-chat-requests
          test ! -e debates/2026-08-27-v4/AGENT-LANES.json
          if grep -RInE 'Demo Repository|demo repository|sample package.json|demo-repo' README.md control-plane/README.md control-plane/index.html control-plane/package.json; then
            echo 'demo-template residue remains in active entry points' >&2
            exit 1
          fi
      - name: Validate reproducible dependency policy
        run: |
          set -euo pipefail
          test -s control-plane/ai-system/mcp/package-lock.json
          grep -Fq 'PLAYWRIGHT_CLI_SPEC="${PLAYWRIGHT_CLI_SPEC:-@playwright/cli@0.1.18}"' control-plane/scripts/bootstrap_ordinary_chat_stack.sh
          grep -Fq 'PLAYWRIGHT_MCP_SPEC="${PLAYWRIGHT_MCP_SPEC:-@playwright/mcp@0.0.79}"' control-plane/scripts/bootstrap_ordinary_chat_stack.sh
          grep -Fq 'BROWSER_USE_SPEC="${BROWSER_USE_SPEC:-browser-use==0.13.8}"' control-plane/scripts/bootstrap_browser_use.sh
          python - <<'PY'
          import json, pathlib
          package = json.loads(pathlib.Path('control-plane/ai-system/mcp/package.json').read_text())
          lock = json.loads(pathlib.Path('control-plane/ai-system/mcp/package-lock.json').read_text())
          if lock.get('lockfileVersion') != 3:
              raise SystemExit('expected npm lockfileVersion 3')
          root = lock.get('packages', {}).get('', {})
          for section in ('dependencies', 'devDependencies'):
              expected = package.get(section, {})
              actual = root.get(section, {})
              if actual != expected:
                  raise SystemExit(f'package/lock mismatch in {section}: expected={expected} actual={actual}')
          PY
      - name: Check bootstrap syntax
        run: |
          bash -n control-plane/scripts/bootstrap_ordinary_chat_stack.sh
          if [ -f control-plane/scripts/bootstrap_browser_use.sh ]; then
            bash -n control-plane/scripts/bootstrap_browser_use.sh
          fi
      - name: Verify runtime artifacts are ignored
        run: |
          for path in \
            .playwright-cli/probe \
            .claude/skills/playwright-cli/SKILL.md \
            control-plane/ai-system/mcp/node_modules/probe \
            control-plane/ai-system/mcp/dist/probe \
            control-plane/ai-system/mcp/.env; do
            git check-ignore -q --no-index "$path" || {
              echo "Expected generated path to be ignored: $path" >&2
              exit 1
            }
          done
      - name: Scan active stack for common committed secret prefixes
        run: |
          if grep -RInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})' \
            control-plane/ai-system/mcp \
            control-plane/ai-system/browser \
            control-plane/scripts/ordinary_chat_bridge.py \
            control-plane/scripts/ordinary_chat_task_runtime.py \
            control-plane/scripts/project_memory.py \
            control-plane/scripts/capability_health.py \
            control-plane/scripts/capability_router.py \
            control-plane/scripts/run_reconciler.py \
            control-plane/ordinary-chat-dashboard \
            skills/ordinary-chat-agent-router; then
            echo 'Potential committed secret detected' >&2
            exit 1
          fi

  mcp-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane/ai-system/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exactly from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck, test, and build MCP gateway
        run: npm run check
      - name: Prove dependency install did not rewrite lockfile
        run: git diff --exit-code -- package.json package-lock.json
