          ! git grep -n 'integration_task_diff_must_equal_verified_A07_diff' -- control-plane/scripts control-plane/tests control-plane/ai-system/control-plane/registry.json control-plane/ai-system/control-plane/state-machine.json
      - name: Commit verified repair and remove bootstrap workflow
        if: success()
        run: |
          rm .github/workflows/plan-scoped-write-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
