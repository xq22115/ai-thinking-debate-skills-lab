version: 1
system: ai-master-system
status: active

assets:
  agents:
    path: ai-system/agents
    entrypoint: ai-system/agents/router.md
    status: active
  control_plane:
    path: ai-system/control-plane
    entrypoint: ai-system/control-plane/README.md
    acceptance_contract_schema: ai-system/control-plane/acceptance-contract.schema.json
    status: active
  skills:
    path: ai-system/skills
    status: active
  skill_authoring:
    canonical: ../skills/skills/skill-authoring-engine/SKILL.md
    github_projection: ../.github/skills/skill-authoring-engine/SKILL.md
    github_agent: ../.github/agents/skill-architect.agent.md
    config: ai-system/configs/skill-authoring-engine.json
    validator: ../skills/skills/skill-authoring-engine/scripts/validate_skill_package.py
    status: experimental
  prompts:
    path: ai-system/prompts
    status: active
  configs:
    path: ai-system/configs
    entrypoint: ai-system/configs/continuous-thinking-global.json
    status: active
  runtime_quality:
    path: scripts
    profile: ai-system/configs/continuous-thinking-global.json
    binder: scripts/continuous_thinking_runtime_binding.py
    workflow_entrypoint: scripts/run_quality_bound_workflow.py
    validator: scripts/validate_quality_runtime_binding.py
    status: active
  mcp:
    path: ai-system/mcp
    status: experimental

routing:
  order:
    - inspect_existing_context
    - select_existing_control_plane
    - select_skill_authoring_engine_when_skill_authoring
    - select_existing_skill
    - select_existing_prompt
    - use_connected_tool
    - add_new_capability_only_if_needed

verification:
  required: true
  accepted_results:
    - PASS
    - VETO
    - FAIL
    - BLOCKED
    - NOT_RUN

runtime_quality:
  required: true
  fail_closed: true
  profile_hash_attestation_required: true
  prompt_binding_required: true
  bound_preparation_evidence_required: true

security:
  secrets_in_repo: forbidden
  credential_placeholders_only: true
